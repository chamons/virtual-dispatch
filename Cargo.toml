[package]
name = "virtual-dispatch"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:directories"]

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
directories = { version = "6.0.0", optional = true }


[profile.dev.package."*"]
opt-level = 3
